# =============================================================
# GitHub Actions — 自动构建并推送 Docker 镜像到 GHCR
# =============================================================
# 触发：
#   - push 到 master 分支（且仅当相关文件变更时）
#   - 手动触发（workflow_dispatch）
#
# 镜像产物：
#   ghcr.io/<owner>/live-source-manager-go:latest
#   ghcr.io/<owner>/live-source-manager-go:master
#   ghcr.io/<owner>/live-source-manager-go:sha-<commit>
#
# 权限：使用仓库内置 GITHUB_TOKEN（packages: write），无需任何 PAT。
# =============================================================

name: Build and Push Docker Image

on:
  push:
    branches: ["master", "main"]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "start_docker.sh"
      - "healthcheck.sh"
      - "go.mod"
      - "go.sum"
      - "main.go"
      - "internal/**"
      - "web/**"
      - "config/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

# 防止并发 push 互相干扰：同一分支排队执行
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-go

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-pull base image (mitigate Docker Hub rate limit)
        run: |
          for i in 1 2 3; do
            if docker pull golang:1.23-bookworm; then
              echo "base image pulled"; break
            fi
            echo "pull attempt $i failed, retry in 15s"; sleep 15
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Live Source Manager (Go)
            org.opencontainers.image.description=Live source manager (Go + SQLite, self-contained binary)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # GitHub Runner 在境外，使用官方 Go 代理（本地 CN 用户默认走 goproxy.cn）
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关闭 provenance/sbom 证明生成，避免需要额外权限导致推送阶段失败
          provenance: false
          sbom: false

      # 构建并推送成功后，自动将包设为 public（李总要求：他人无需登录即可 docker pull）
      # 使用仓库内置 GITHUB_TOKEN（含 packages: write），不依赖任何 PAT。
      - name: Make package public
        if: success()
        run: |
          echo "Setting package visibility to public..."
          PKG_NAME="$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${PKG_NAME}/visibility" \
            -d '{"visibility":"public"}' \
            -w "PATCH_HTTP %{http_code}\n" \
            || echo "set-public skipped (manual action needed)"
